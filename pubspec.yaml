name: interactive_svg
description: "A lightweight Flutter package for rendering SVGs with selectable, interactive regions, supporting hit-testing, bounds extraction, and zoom/scroll functionality."
version: 0.0.2
homepage: https://github.com/sonnts996/interactive_svg

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.1
  path_drawing: ^1.0.1
  xml: ^6.6.1
  copy_with_extension: ^10.0.1
  meta: ^1.16.0
  collection: ^1.19.1
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.1
  copy_with_extension_gen: ^10.0.1
  owlet_lints: ^5.0.0

